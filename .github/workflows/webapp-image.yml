name: webapp image

# Builds the container image of the hosted web app (deploy/serve/Dockerfile)
# and checks it. The publish job pushes the checked image to the GitHub
# Container Registry only for a release tag (v*), or for a manual run with
# "publish" set to true.

on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'src/envoi_webapp/**'
      - 'src/envoi/**'
      - 'pyproject.toml'
      - '.dockerignore'
      - '.github/workflows/webapp-image.yml'
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the image to ghcr.io/biodiversitydatalab/envoi-webapp after the checks pass'
        type: boolean
        default: false

permissions:
  contents: read

env:
  CHECK_TAG: envoi-webapp:check
  CONTAINER_NAME: envoi-webapp-check
  IMAGE_REPOSITORY: ghcr.io/biodiversitydatalab/envoi-webapp
  IMAGE_ARCHIVE: envoi-webapp-image.tar.gz

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      image: ${{ steps.decide.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # Publish only for a pushed release tag, or for a manual run that asks
      # for it. The image tag is <package version>-<short commit SHA>, so each
      # version on the registry has a new tag.
      - name: Decide whether to publish, and the image tag
        id: decide
        env:
          PUBLISH: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: |
          version=$(python3 -c 'import runpy; print(runpy.run_path("src/envoi/_version.py")["__version__"])')
          image="$IMAGE_REPOSITORY:$version-${GITHUB_SHA::7}"
          echo "Publish: $PUBLISH. Image: $image"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Build the image
        run: docker build --file deploy/serve/Dockerfile --tag "$CHECK_TAG" .

      - name: Start the app
        run: docker run --detach --name "$CONTAINER_NAME" --publish 8501:8501 "$CHECK_TAG"

      - name: Wait for the health endpoint (at most 60 s)
        run: |
          deadline=$((SECONDS + 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 \
              http://localhost:8501/_stcore/health || true)
            if [ "$status" = "200" ]; then
              echo "The health endpoint answered with HTTP 200."
              exit 0
            fi
            sleep 2
          done
          echo "::error::The health endpoint did not answer with HTTP 200 within 60 s."
          exit 1

      - name: Check that the app runs as UID 1000
        run: |
          uid=$(docker exec "$CONTAINER_NAME" id -u)
          echo "UID of the app user: $uid"
          if [ "$uid" != "1000" ]; then
            echo "::error::The app runs as UID $uid, not as UID 1000."
            exit 1
          fi

      # The smoke check runs the page script with AppTest in hosted mode, and a
      # real worker process with a generated key that is not valid. It needs no
      # network.
      - name: Run the smoke check
        run: docker run --rm --network none --entrypoint python "$CHECK_TAG" smoke_check.py

      # As root, so that find can read every folder of the image.
      - name: Search the image for credentials
        run: |
          docker run --rm --interactive --user root --entrypoint sh "$CHECK_TAG" -s <<'EOF'
          set -eu
          status=0
          # Folders named "credentials" anywhere in the image file system.
          credential_folders=$(find / -xdev -type d -name credentials -print)
          if [ -n "$credential_folders" ]; then
            echo "Folders named credentials:"
            echo "$credential_folders"
            status=1
          fi
          # JSON files with a service-account key anywhere in the image file
          # system, which includes /app and the site-packages.
          key_files=$(find / -xdev -type f -name '*.json' \
            -exec grep -l -E '"type"[[:space:]]*:[[:space:]]*"service_account"' {} + || true)
          if [ -n "$key_files" ]; then
            echo "JSON files with a service-account key:"
            echo "$key_files"
            status=1
          fi
          if [ "$status" -eq 0 ]; then
            echo "No credentials folder and no service-account JSON file in the image."
          fi
          exit "$status"
          EOF

      - name: Show the app log
        if: failure()
        run: docker logs "$CONTAINER_NAME" || true

      - name: Stop the app
        if: always()
        run: docker rm --force "$CONTAINER_NAME" || true

      # The publish job pushes this checked image, not a new build.
      - name: Save the image for the publish job
        if: steps.decide.outputs.publish == 'true'
        run: docker save "$CHECK_TAG" | gzip > "$IMAGE_ARCHIVE"

      - name: Upload the image
        if: steps.decide.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: envoi-webapp-image
          path: ${{ env.IMAGE_ARCHIVE }}
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build-and-check
    if: needs.build-and-check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Only this job can write packages. It runs no repository code.
    permissions:
      packages: write
    env:
      IMAGE: ${{ needs.build-and-check.outputs.image }}
    steps:
      - name: Download the checked image
        uses: actions/download-artifact@v4
        with:
          name: envoi-webapp-image

      - name: Load and tag the image
        run: |
          gunzip --stdout "$IMAGE_ARCHIVE" | docker load
          docker tag "$CHECK_TAG" "$IMAGE"

      - name: Log in to the GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Serve needs a new tag for each version, and a rollback selects an
      # earlier tag, so a published tag must never change.
      - name: Push the image
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "::error::The tag $IMAGE exists already. Published tags must not change."
            exit 1
          fi
          docker push "$IMAGE"
          echo "Published $IMAGE"
