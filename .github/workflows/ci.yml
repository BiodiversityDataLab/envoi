name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,webapp]"
      - name: Lint
        run: |
          ruff check src tests
          black --check src tests
      - name: Tests
        run: pytest -q

  # The offline test suite on Windows and macOS. envoi supports both, and file
  # names, paths, and raster I/O can differ there. One Python version is enough:
  # the build job above covers the Python versions on Linux.
  portability:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,webapp]"
      - name: Tests
        run: pytest -m "not gee" -q

  # The offline test suite at the oldest versions that pyproject.toml allows,
  # on the oldest supported Python. The pins come from pyproject.toml itself
  # (each '>=' becomes '=='), so this job follows the declared minimums.
  minimum-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Pin the minimum versions
        run: |
          python -m pip install -U pip tomli
          python .github/scripts/minimum_constraints.py > minimum-constraints.txt
          cat minimum-constraints.txt
      - name: Install
        run: pip install -e ".[dev,webapp]" -c minimum-constraints.txt
      - name: Tests
        run: pytest -m "not gee" -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          python -m pip install -U pip
          pip install build twine
      - name: Build distribution
        run: python -m build
      - name: Check metadata
        run: twine check dist/*

      # CITATION.cff drives GitHub's "Cite this repository" button and the metadata
      # on the Zenodo DOI record minted for each published release, so a malformed or
      # stale citation file should fail the build rather than reach a permanent
      # archive. This lives in the single-run `package` job on purpose — there is
      # nothing Python-version-specific about it, so running it once is enough.
      - name: Validate citation metadata
        run: |
          pip install cffconvert pyyaml
          # Schema check: is CITATION.cff valid Citation File Format?
          cffconvert --validate
          # Consistency check: does its version match src/envoi/_version.py?
          python .github/scripts/check_citation_version.py
