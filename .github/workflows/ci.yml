name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,webapp]"
      - name: Lint
        run: |
          ruff check src tests deploy
          black --check src tests deploy
      - name: Tests
        run: pytest -q

  # The web app runs each extraction in a worker process, and process start,
  # pipes, and process stop differ between operating systems. The build job
  # above covers Linux. This job runs the web-app worker and job tests on
  # Windows and macOS.
  webapp-portability:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,webapp]"
      - name: Web-app worker and job tests
        run: >-
          pytest
          tests/test_webapp_job_protocol.py
          tests/test_webapp_worker.py
          tests/test_webapp_jobs.py
          tests/test_webapp_settings.py
          tests/test_webapp_apptest.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          python -m pip install -U pip
          pip install build twine
      - name: Build distribution
        run: python -m build
      - name: Check metadata
        run: twine check dist/*

      # CITATION.cff drives GitHub's "Cite this repository" button and the metadata
      # on the Zenodo DOI record minted for each published release, so a malformed or
      # stale citation file should fail the build rather than reach a permanent
      # archive. This lives in the single-run `package` job on purpose — there is
      # nothing Python-version-specific about it, so running it once is enough.
      - name: Validate citation metadata
        run: |
          pip install cffconvert pyyaml
          # Schema check: is CITATION.cff valid Citation File Format?
          cffconvert --validate
          # Consistency check: does its version match src/envoi/_version.py?
          python .github/scripts/check_citation_version.py
